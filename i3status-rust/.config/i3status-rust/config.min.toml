#plain (default) plain
#solarized-dark solarized-dark
#solarized-light solarized-light
#slick slick
#modern modern
#bad-wolf bad-wolf
#gruvbox-light gruvbox-light
#gruvbox-dark gruvbox-dark
#space-villain space-villain
#native (like plain with no background and native separators) native
#semi-native (like native but with background) //TODO add an image
#nord-dark (polar night) nord-dark
#dracula

[theme]
theme = "ctp-latte"
[theme.overrides]
idle_bg = "#eff1f5"
#idle_fg = "#000000"
[icons]
icons = "awesome4"
[icons.overrides]
music = ""

#[[block]]
#block = "xrandr"
#format = "$icon $resolution"

[[block]]
block = "sound"

[[block]]
block = "uptime"

[[block]]
block = "time"
interval = 60
[block.format]
full = "  $timestamp.datetime(f:'%d/%m', l:en_US) "

[[block]]
block = "time"
interval = 1
[block.format]
full = "  $timestamp.datetime(f:'%I:%M:%S%P', l:en_US) "

